name: Release

# Official releases for version tags vX.Y.Z (not vX.Y.Z-beta-N).
#
# Important: pushes made with the default GITHUB_TOKEN do not start new workflow
# runs. So we must package in the same run that ensures the version tag exists
# on main — not rely on a follow-up "tag push" event.
#
# Parallel release-mac + release-win attach assets to one GitHub Release.
on:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve release tag
    runs-on: macos-latest
    timeout-minutes: 10
    outputs:
      run_release: ${{ steps.resolve.outputs.run_release }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Resolve whether to run official release
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            VERSION="v$(node -p "require('./package.json').version")"
            if [[ "$VERSION" == *"-beta-"* ]] || [[ "$VERSION" == *"-"* ]]; then
              echo "::error::package.json version for official release must be X.Y.Z without prerelease suffix, got ${VERSION#v}"
              exit 1
            fi

            echo "Official version tag: $VERSION"
            git fetch --tags origin 2>/dev/null || true

            if git ls-remote --exit-code origin "refs/tags/$VERSION" >/dev/null 2>&1; then
              echo "Tag $VERSION already exists on origin"
            else
              echo "Creating and pushing tag $VERSION"
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "$VERSION" -m "Release $VERSION"
              git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${VERSION}"
            fi

            echo "run_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Tag push path (manual re-tag or external tag create)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            if [[ "$TAG" == *"-beta-"* ]]; then
              echo "Skipping beta tag $TAG (owned by beta-release.yml)"
              echo "run_release=false" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "run_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run_release=false" >> "$GITHUB_OUTPUT"
          echo "tag=" >> "$GITHUB_OUTPUT"

      # Create the release shell first so parallel mac/win jobs only attach files
      # (avoids softprops races creating the same release twice).
      - name: Create GitHub Release shell
        if: steps.resolve.outputs.run_release == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: ${{ steps.resolve.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## Release `${{ steps.resolve.outputs.tag }}`

            Official dual-platform build from `${{ github.sha }}`.

            | Platform | Artifacts |
            | --- | --- |
            | macOS | DMG + ZIP (`arm64`, `x64`) |
            | Windows | NSIS installer + portable (`x64`, `arm64`) |

            Prefer the NSIS `.exe` (not `-portable`) on Windows for auto-update.
            Prefer the DMG matching your Mac architecture (`arm64` Apple Silicon, `x64` Intel).

  release-mac:
    name: Build and publish macOS release
    needs: prepare
    if: needs.prepare.outputs.run_release == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Preflight version tag
        env:
          EXPECTED_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          expected_tag="v$(bun -e 'const packageInfo = await Bun.file("package.json").json(); process.stdout.write(packageInfo.version)')"
          if [ "$EXPECTED_TAG" != "$expected_tag" ]; then
            echo "::error::Release tag $EXPECTED_TAG does not match package.json version $expected_tag"
            exit 1
          fi
          echo "Version preflight OK for $EXPECTED_TAG"

      - name: Detect signing credentials
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          # Full signed+notarized path only when the complete secret set is present.
          # Missing CSC_LINK (or any other secret) falls back to unsigned packaging.
          if [ -n "${CSC_LINK:-}" ] && [ -n "${CSC_KEY_PASSWORD:-}" ] \
            && [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] \
            && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "Signing + notarize credentials present — signed official package"
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing/notarize secrets incomplete (e.g. no CSC_LINK). Packaging unsigned; Gatekeeper may block casual installs. verify:macos-release will be skipped."
          fi

      - name: Build, sign, notarize, and package (mac)
        if: steps.signing.outputs.mode == 'signed'
        run: bun run package:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Build and package (unsigned fallback)
        if: steps.signing.outputs.mode == 'unsigned'
        run: bun run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify signed release containers
        if: steps.signing.outputs.mode == 'signed'
        run: bun run verify:macos-release

      - name: List dist artifacts
        run: |
          set -euo pipefail
          ls -la dist/ || true
          ls -la dist/GogMeet-*.dmg dist/GogMeet-*.zip 2>/dev/null || {
            echo "::error::Expected GogMeet DMG/ZIP artifacts missing from dist/"
            exit 1
          }

      - name: Create mac checksum fragment
        run: |
          set -euo pipefail
          shasum -a 256 \
            dist/GogMeet-*-arm64.dmg \
            dist/GogMeet-*-arm64.zip \
            dist/GogMeet-*-x64.dmg \
            dist/GogMeet-*-x64.zip \
            > dist/SHA256SUMS-mac.txt
          cat dist/SHA256SUMS-mac.txt

      - name: Upload mac release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          token: ${{ github.token }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            dist/GogMeet-*-arm64.dmg
            dist/GogMeet-*-arm64.zip
            dist/GogMeet-*-x64.dmg
            dist/GogMeet-*-x64.zip
            dist/SHA256SUMS-mac.txt
            dist/latest-mac.yml

  release-win:
    name: Build and publish Windows release
    needs: prepare
    if: needs.prepare.outputs.run_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Prefer LF line endings on checkout
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Preflight version tag
        env:
          EXPECTED_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          expected_tag="v$(bun -e 'const packageInfo = await Bun.file("package.json").json(); process.stdout.write(packageInfo.version)')"
          if [ "$EXPECTED_TAG" != "$expected_tag" ]; then
            echo "::error::Release tag $EXPECTED_TAG does not match package.json version $expected_tag"
            exit 1
          fi
          echo "Version preflight OK for $EXPECTED_TAG"

      - name: Configure optional Windows code signing
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${WIN_CSC_LINK:-}" ] && [ -n "${WIN_CSC_KEY_PASSWORD:-}" ]; then
            echo "CSC_LINK=${WIN_CSC_LINK}" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=${WIN_CSC_KEY_PASSWORD}" >> "$GITHUB_ENV"
            echo "REQUIRE_WIN_SIGN=1" >> "$GITHUB_ENV"
            echo "Windows Authenticode secrets present — signing enabled"
          else
            echo "Windows Authenticode secrets absent — unsigned dogfood artifacts (K30)"
          fi

      - name: Build Windows x64 (NSIS + portable)
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          # package:win:* uses --publish never; softprops owns GitHub upload
          GH_TOKEN: ${{ github.token }}
        run: bun run package:win:x64

      - name: Build Windows arm64 (NSIS + portable)
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: bun run package:win:arm64

      - name: Merge latest.yml for both NSIS arches
        run: bun run merge:windows-latest-yml

      - name: Verify Windows release inventory
        env:
          REQUIRE_UPDATER_YML: "1"
        run: bun run verify:windows-release

      - name: Create Windows checksum fragment
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            HASH=sha256sum
          else
            HASH="shasum -a 256"
          fi
          $HASH \
            dist/GogMeet-*-x64.exe \
            dist/GogMeet-*-arm64.exe \
            dist/GogMeet-*-x64-portable.exe \
            dist/GogMeet-*-arm64-portable.exe \
            dist/latest.yml \
            > dist/SHA256SUMS-win.txt
          cat dist/SHA256SUMS-win.txt

      - name: Upload Windows release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          token: ${{ github.token }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/GogMeet-*-x64.exe
            dist/GogMeet-*-arm64.exe
            dist/GogMeet-*-x64-portable.exe
            dist/GogMeet-*-arm64-portable.exe
            dist/latest.yml
            dist/SHA256SUMS-win.txt
