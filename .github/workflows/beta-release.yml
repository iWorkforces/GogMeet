name: Beta Release

# Builds and publishes dual-platform beta pre-releases whenever code lands on
# develop (typically after a PR merge). Tags look like v1.16.0-beta-1, …
# Artifacts: mac DMG/ZIP + Windows NSIS/portable for x64 and arm64.
on:
  push:
    branches:
      - develop

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve beta tag
    runs-on: macos-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.beta.outputs.tag }}
      app_version: ${{ steps.beta.outputs.app_version }}
      base: ${{ steps.beta.outputs.base }}
      beta_number: ${{ steps.beta.outputs.beta_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Compute next beta version and tag
        id: beta
        run: |
          set -euo pipefail

          git fetch --tags origin 2>/dev/null || true

          BASE="$(bun -e 'const p = await Bun.file("package.json").json(); process.stdout.write(String(p.version).split("-")[0])')"
          PREFIX="v${BASE}-beta-"

          # Collect local + remote tags for this base (shared script picks max N+1)
          TAGS="$(
            {
              git tag -l "${PREFIX}*" 2>/dev/null || true
              git ls-remote --tags origin "refs/tags/${PREFIX}*" 2>/dev/null | awk '{print $2}' || true
            } | sort -u
          )"

          RESULT="$(node scripts/next-beta-tag.mjs --base "$BASE" --tags "$TAGS")"
          echo "Computed: $RESULT"

          TAG="$(node -e 'const r=JSON.parse(process.argv[1]); process.stdout.write(r.tag)' "$RESULT")"
          APP_VERSION="$(node -e 'const r=JSON.parse(process.argv[1]); process.stdout.write(r.appVersion)' "$RESULT")"
          NEXT="$(node -e 'const r=JSON.parse(process.argv[1]); process.stdout.write(String(r.betaNumber))' "$RESULT")"

          echo "Next beta: $TAG (app version $APP_VERSION)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "beta_number=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Create beta tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.beta.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Tag the develop tip (not a version-bumped working tree)
          git tag -a "$TAG" -m "Beta release $TAG"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}"

      # Create the pre-release shell first so parallel mac/win jobs only attach files
      # (avoids two softprops calls racing to create the same release).
      - name: Create GitHub pre-release shell
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.beta.outputs.tag }}
          name: ${{ steps.beta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            ## Beta pre-release `${{ steps.beta.outputs.tag }}`

            Auto-built from `develop` (`${{ github.sha }}`).

            | Field | Value |
            | --- | --- |
            | Base version | `${{ steps.beta.outputs.base }}` |
            | Beta number | `${{ steps.beta.outputs.beta_number }}` |
            | App version | `${{ steps.beta.outputs.app_version }}` |
            | Platforms | macOS (DMG/ZIP) + Windows (NSIS/portable) |

            ### Install notes
            - **macOS:** prefer the DMG matching your architecture (`arm64` Apple Silicon, `x64` Intel).
            - **Windows:** use the NSIS installer (`.exe` without `-portable`) for auto-update; portable builds do not auto-update.
            - **Unsigned betas** may be blocked by Gatekeeper / SmartScreen; use **Open Anyway** or remove quarantine after install when signing secrets were absent.

            This is a **pre-release** and is not marked as Latest.

  beta-mac:
    name: Build and publish macOS beta
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect Apple signing credentials
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${CSC_LINK:-}" ] && [ -n "${CSC_KEY_PASSWORD:-}" ] \
            && [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] \
            && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "Signing + notarize credentials present — official-style beta package"
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing/notarize secrets incomplete. Beta will be packaged without Developer ID signing/notarization (Gatekeeper will block casual installs)."
          fi

      - name: Set package.json version for beta artifacts
        run: |
          set -euo pipefail
          APP_VERSION="${{ needs.prepare.outputs.app_version }}"
          bun -e '
            const fs = require("fs");
            const path = "package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.version = process.env.APP_VERSION;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
            console.log("package.json version ->", pkg.version);
          '
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}

      - name: Build and package (signed + notarized)
        if: steps.signing.outputs.mode == 'signed'
        run: bun run package:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Build and package (unsigned / local-style)
        if: steps.signing.outputs.mode == 'unsigned'
        run: bun run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify signed release containers
        if: steps.signing.outputs.mode == 'signed'
        run: bun run verify:macos-release

      - name: List dist artifacts
        run: |
          set -euo pipefail
          ls -la dist/ || true
          ls -la dist/GogMeet-*.dmg dist/GogMeet-*.zip 2>/dev/null || {
            echo "::error::Expected GogMeet DMG/ZIP artifacts missing from dist/"
            exit 1
          }

      - name: Create mac checksum fragment
        run: |
          set -euo pipefail
          shasum -a 256 \
            dist/GogMeet-*-arm64.dmg \
            dist/GogMeet-*-arm64.zip \
            dist/GogMeet-*-x64.dmg \
            dist/GogMeet-*-x64.zip \
            > dist/SHA256SUMS-mac.txt
          cat dist/SHA256SUMS-mac.txt

      - name: Upload mac beta assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          token: ${{ github.token }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: false
          files: |
            dist/GogMeet-*-arm64.dmg
            dist/GogMeet-*-arm64.zip
            dist/GogMeet-*-x64.dmg
            dist/GogMeet-*-x64.zip
            dist/SHA256SUMS-mac.txt
            dist/latest-mac.yml

  beta-win:
    name: Build and publish Windows beta
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Prefer LF line endings on checkout
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set package.json version for beta artifacts
        run: |
          set -euo pipefail
          APP_VERSION="${{ needs.prepare.outputs.app_version }}"
          bun -e '
            const fs = require("fs");
            const path = "package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.version = process.env.APP_VERSION;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
            console.log("package.json version ->", pkg.version);
          '
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}

      - name: Configure optional Windows code signing
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${WIN_CSC_LINK:-}" ] && [ -n "${WIN_CSC_KEY_PASSWORD:-}" ]; then
            echo "CSC_LINK=${WIN_CSC_LINK}" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=${WIN_CSC_KEY_PASSWORD}" >> "$GITHUB_ENV"
            echo "REQUIRE_WIN_SIGN=1" >> "$GITHUB_ENV"
            echo "Windows Authenticode secrets present — signing enabled"
          else
            echo "Windows Authenticode secrets absent — unsigned dogfood artifacts (K30)"
          fi

      - name: Build Windows x64 (NSIS + portable)
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: bun run package:win:x64

      - name: Build Windows arm64 (NSIS + portable)
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: bun run package:win:arm64

      - name: Merge latest.yml for both NSIS arches
        run: bun run merge:windows-latest-yml

      - name: Verify Windows release inventory
        env:
          REQUIRE_UPDATER_YML: "1"
        run: bun run verify:windows-release

      - name: Create Windows checksum fragment
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            HASH=sha256sum
          else
            HASH="shasum -a 256"
          fi
          $HASH \
            dist/GogMeet-*-x64.exe \
            dist/GogMeet-*-arm64.exe \
            dist/GogMeet-*-x64-portable.exe \
            dist/GogMeet-*-arm64-portable.exe \
            dist/latest.yml \
            > dist/SHA256SUMS-win.txt
          cat dist/SHA256SUMS-win.txt

      - name: Upload Windows beta assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          token: ${{ github.token }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/GogMeet-*-x64.exe
            dist/GogMeet-*-arm64.exe
            dist/GogMeet-*-x64-portable.exe
            dist/GogMeet-*-arm64-portable.exe
            dist/latest.yml
            dist/SHA256SUMS-win.txt
