name: PR Check

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Private repo: windows-latest only for Windows (K31). No windows-11-arm.
        os: [macos-latest, windows-latest]

    defaults:
      run:
        # Git Bash on windows-latest keeps scripts portable with macOS.
        shell: bash

    steps:
      # Git for Windows defaults to core.autocrlf=true, which rewrites LF→CRLF on
      # checkout. Prettier is configured with endOfLine: "lf", so lint fails only
      # on windows-latest unless we keep LF in the working tree.
      - name: Prefer LF line endings on checkout
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Permanent guardrails scan
        run: bun run guardrails

      - name: Permanent guardrails freeze tests
        run: bun run guardrails:tests

      - name: Swift package layout (dual sources)
        run: bun run check:swift-package-layout

      - name: Build
        run: bun run build

      - name: Test with coverage
        run: bun run test:coverage

      - name: List changed TypeScript sources
        id: changed-typescript
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          echo "base-sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          changed_sources="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- 'src/**/*.ts' || true)"
          if [ -n "$changed_sources" ]; then
            echo "has-files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-files=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "files<<EOF"
            printf '%s\n' "$changed_sources"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run related tests for changed TypeScript
        if: steps.changed-typescript.outputs.has-files == 'true'
        env:
          CHANGED_SOURCES: ${{ steps.changed-typescript.outputs.files }}
        run: |
          source_files=()
          while IFS= read -r source_file; do
            [ -n "$source_file" ] || continue
            source_files+=("$source_file")
          done <<< "$CHANGED_SOURCES"
          if [ ${#source_files[@]} -eq 0 ]; then
            echo "No changed TypeScript files to test"
            exit 0
          fi
          bun x vitest related --run -c vitest.workspace.ts "${source_files[@]}"

      - name: Report changed TypeScript coverage
        if: steps.changed-typescript.outputs.has-files == 'true'
        env:
          BASE_SHA: ${{ steps.changed-typescript.outputs.base-sha }}
          CHANGED_SOURCES: ${{ steps.changed-typescript.outputs.files }}
        run: |
          source_files=()
          while IFS= read -r source_file; do
            [ -n "$source_file" ] || continue
            source_files+=("$source_file")
          done <<< "$CHANGED_SOURCES"
          if [ ${#source_files[@]} -eq 0 ]; then
            exit 0
          fi
          # Report-only for changed sources: no percentage floors (global floors
          # still apply to "Test with coverage"). Without disabling thresholds,
          # vitest.workspace floors fail this step when related tests leave
          # package-only probe/bootstrap branches unexercised.
          bun x vitest related --run -c vitest.workspace.ts \
            --coverage.enabled \
            --coverage.changed "$BASE_SHA" \
            --coverage.reporter=text \
            --coverage.thresholds.lines=0 \
            --coverage.thresholds.functions=0 \
            --coverage.thresholds.statements=0 \
            --coverage.thresholds.branches=0 \
            "${source_files[@]}"

  validate-node:
    name: Validate host Node 26
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Print host Node version
        run: node --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate host Node and regenerate icons
        run: bun run validate:node

      - name: Verify generated icons are committed
        run: git diff --exit-code
